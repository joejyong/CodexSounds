name: Release Windows plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check the release version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $manifest = Get-Content -Raw '.codex-plugin/plugin.json' | ConvertFrom-Json
          $manifestVersion = ([string]$manifest.version).Split('+')[0]
          if ($version -ne $manifestVersion) {
            throw "Tag version $version does not match manifest version $manifestVersion."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run JavaScript checks
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test

      - name: Install Python dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Build the Windows helper
        shell: pwsh
        run: .\scripts\Build-Plugin.ps1

      - name: Package the plugin
        shell: pwsh
        run: .\scripts\Package-Release.ps1 -Version $env:RELEASE_VERSION

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-sounds-${{ env.RELEASE_VERSION }}-windows-x64
          path: |
            outputs/codex-sounds-windows-x64.zip
            outputs/codex-sounds-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            'outputs/codex-sounds-windows-x64.zip#Codex Sounds for Windows x64' `
            'outputs/codex-sounds-windows-x64.zip.sha256#SHA-256 checksum' `
            --verify-tag `
            --title "Codex Sounds $env:GITHUB_REF_NAME" `
            --generate-notes
